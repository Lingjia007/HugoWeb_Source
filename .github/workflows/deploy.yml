name: Deploy to GitHub Pages and Netlify

on:
  push:
    branches:
      - main

jobs:
  deploy-to-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Git Configuration
        run: |
          git config --global core.quotePath false
          git config --global core.autocrlf false
          git config --global core.safecrlf true
          git config --global core.ignorecase false

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - name: Build Hugo site
        run: hugo -F --cleanDestinationDir

      - name: Fix favicon path for GitHub Pages
        run: |
          # 将绝对路径 /icons/favicon.ico 替换为 /Hugo_Web/icons/favicon.ico
          find public -name "*.html" -exec sed -i 's|href="/icons/favicon.ico"|href="/Hugo_Web/icons/favicon.ico"|g' {} +

      # 仅在需要特殊处理时保留此步骤
      - name: Copy static and assets (Conditional)
        if: true # 默认禁用，需要时设为 true
        run: |
          mkdir -p public/en public/zh-hk
          cp -r static/* public/en/
          cp -r static/* public/zh-hk/
          cp -r assets/* public/en/
          cp -r assets/* public/zh-hk/

      - name: Create Hugo_Web Pages deployment workflow
        run: |
          mkdir -p public/.github/workflows
          echo 'name: Deploy Pages with Retry' > public/.github/workflows/pages.yml
          echo '' >> public/.github/workflows/pages.yml
          echo 'on:' >> public/.github/workflows/pages.yml
          echo '  push:' >> public/.github/workflows/pages.yml
          echo '    branches:' >> public/.github/workflows/pages.yml
          echo '      - master' >> public/.github/workflows/pages.yml
          echo '' >> public/.github/workflows/pages.yml
          echo 'permissions:' >> public/.github/workflows/pages.yml
          echo '  contents: read' >> public/.github/workflows/pages.yml
          echo '  pages: write' >> public/.github/workflows/pages.yml
          echo '  id-token: write' >> public/.github/workflows/pages.yml
          echo '' >> public/.github/workflows/pages.yml
          echo 'concurrency:' >> public/.github/workflows/pages.yml
          echo '  group: "pages"' >> public/.github/workflows/pages.yml
          echo '  cancel-in-progress: false' >> public/.github/workflows/pages.yml
          echo '' >> public/.github/workflows/pages.yml
          echo 'jobs:' >> public/.github/workflows/pages.yml
          echo '  deploy:' >> public/.github/workflows/pages.yml
          echo '    runs-on: ubuntu-latest' >> public/.github/workflows/pages.yml
          echo '    steps:' >> public/.github/workflows/pages.yml
          echo '      - name: Checkout' >> public/.github/workflows/pages.yml
          echo '        uses: actions/checkout@v5' >> public/.github/workflows/pages.yml
          echo '' >> public/.github/workflows/pages.yml
          echo '      - name: Setup Pages' >> public/.github/workflows/pages.yml
          echo '        uses: actions/configure-pages@v5' >> public/.github/workflows/pages.yml
          echo '' >> public/.github/workflows/pages.yml
          echo '      - name: Upload artifact' >> public/.github/workflows/pages.yml
          echo '        uses: actions/upload-pages-artifact@v3' >> public/.github/workflows/pages.yml
          echo '        with:' >> public/.github/workflows/pages.yml
          echo '          path: "."' >> public/.github/workflows/pages.yml
          echo '' >> public/.github/workflows/pages.yml
          echo '      - name: Deploy to GitHub Pages' >> public/.github/workflows/pages.yml
          echo '        uses: Wandalen/wretry.action@v3' >> public/.github/workflows/pages.yml
          echo '        with:' >> public/.github/workflows/pages.yml
          echo '          action: actions/deploy-pages@v4' >> public/.github/workflows/pages.yml
          echo '          attempt_limit: 5' >> public/.github/workflows/pages.yml
          echo '          attempt_delay: 30000' >> public/.github/workflows/pages.yml
          # 验证文件创建
          cat public/.github/workflows/pages.yml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          PERSONAL_TOKEN: ${{ secrets.TOKEN }}
          EXTERNAL_REPOSITORY: Lingjia007/Hugo_Web
          PUBLISH_BRANCH: master
          PUBLISH_DIR: ./public
          commit_message: ${{ github.event.head_commit.message }}

  deploy-to-netlify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Git Configuration
        run: |
          git config --global core.quotePath false
          git config --global core.autocrlf false
          git config --global core.safecrlf true
          git config --global core.ignorecase false

      - name: Switch to netlify branch
        run: git checkout -B netlify

      - name: Modify baseURL for Netlify
        run: |
          # 确认 hugo.yaml 文件路径正确
          sed -i '1s#https://lingjia007.github.io/Hugo_Web/#https://lingsir007.netlify.app/#' hugo.yaml

      - name: Modify Waifu Tips Path
        run: |
          # 修改 waifu 提示文件路径
          sed -i 's#Hugo_Web/##g' static/js/my-waifu-tips.json

      - name: Commit config changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add hugo.yaml static/js/my-waifu-tips.json
          git commit -m "Update Netlify config"
          git push origin netlify --force  # 强制推送

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - name: Build Hugo site
        run: hugo -F --cleanDestinationDir

      # 仅在需要特殊处理时保留此步骤
      - name: Copy static and assets (Conditional)
        if: true # 默认禁用，需要时设为 true
        run: |
          mkdir -p public/en public/zh-hk
          cp -r static/* public/en/
          cp -r static/* public/zh-hk/
          cp -r assets/* public/en/
          cp -r assets/* public/zh-hk/

      - name: Deploy to Netlify Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          PERSONAL_TOKEN: ${{ secrets.TOKEN }}
          EXTERNAL_REPOSITORY: Lingjia007/Hugo_Web
          PUBLISH_BRANCH: netlify
          PUBLISH_DIR: ./public
          commit_message: "Deploy to Netlify: ${{ github.sha }}"
          force_orphan: false
